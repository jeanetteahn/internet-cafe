<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
  <style>
    /* ---- Shadow tuning knobs ----
       Values must match --shadow-* in kiosk-carbon.html and kiosk-clock.html;
       all three files are intentionally duplicated (no shared CSS source across
       the CSP/preload boundary).  Change all three together. */
    :root {
      --shadow-pad:   24px; /* must match FK_SHADOW_PAD in kiosk-browsers.js */
      --shadow-dx:    0px;
      --shadow-dy:    4px;
      --shadow-blur:  18px;
      --shadow-color: rgba(0, 0, 0, 0.42);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
      display: flex;
      flex-direction: row;
      align-items: stretch;
    }

    /* ---- Outer container ----
       Window is FK_GRAPHIC_W + 2*FK_SHADOW_PAD wide, FK_GRAPHIC_H + 2*FK_SHADOW_PAD tall
       (currently 158 px wide, 87 px tall — see kiosk-browsers.js).
       Hit areas (#fork, #knife) are inset by --shadow-pad on all sides to match the
       graphic; clicks in the transparent shadow padding are ignored by the hit test. */
    #right {
      position: relative;
      flex: 1;
      height: 100%;
    }

    /* Each div covers one half of the graphic area (inset by --shadow-pad),
       acting as a generous click target for fork (top) and knife (bottom). */
    #fork, #knife {
      position: absolute;
      left: var(--shadow-pad);
      right: var(--shadow-pad);
    }
    #fork  { top: var(--shadow-pad);    height: calc((100% - 2 * var(--shadow-pad)) / 2); }
    #knife { bottom: var(--shadow-pad); height: calc((100% - 2 * var(--shadow-pad)) / 2); }

    /* disabled: the .disabled class updates aria-disabled and tabindex only.
       Both groups always render at full opacity — tapping a disabled half is
       silently ignored by the pointerup guard. */
    .utensil:focus       { outline: none; }
    .utensil:focus-visible { outline: 2px solid #5a8fd8; outline-offset: -2px; }


    /* SVG graphic inset by --shadow-pad; overflow:visible lets each group's
       drop-shadow bleed into the window's transparent padding area. */
    #fk-svg {
      position: absolute;
      left: var(--shadow-pad);
      top: var(--shadow-pad);
      width: calc(100% - 2 * var(--shadow-pad));
      height: auto;
      overflow: visible;
      pointer-events: none;
      display: block;
    }

    /* Each group carries its own drop-shadow.  Opacity is always 1 — the groups
       never dim; disabled state is enforced by the tap guard in JS only. */
    #g-fork, #g-knife {
      filter: drop-shadow(var(--shadow-dx) var(--shadow-dy) var(--shadow-blur) var(--shadow-color));
    }
  </style>
</head>
<body>

  <!-- Whole control: top half = fork (forward), bottom half = knife (back).
       Drag anywhere in the graphic area to move; tap a half to navigate. -->
  <div id="right">
    <!-- Fork = Forward (top half of graphic) -->
    <div id="fork" class="utensil" role="button" tabindex="0" aria-label="Forward"></div>
    <!-- Knife = Back (bottom half of graphic) -->
    <div id="knife" class="utensil" role="button" tabindex="0" aria-label="Back"></div>

    <!-- Visual graphic — pointer-events:none lets clicks reach the divs above.
         Size driven by CSS (width:calc(100%-2*pad); height:auto) — no hardcoded px. -->
    <svg id="fk-svg" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 61.72 21.86" aria-hidden="true">
      <!-- Fork (forward) paths — spans y ≈ 0–8 in viewBox -->
      <g id="g-fork">
        <path fill="#ea4b00" d="M14.74,7.47c-.09,0-.19,0-.28-.01l-3.4-.35-3.56-.39,6.3.12c.49,0,.85-.29.91-.71.04-.25-.04-.54-.21-.74-.16-.19-.37-.3-.61-.31l-2.28-.08h2.1c.71-.01.99-.44,1.09-.7.11-.26.1-.69-.11-1-.15-.23-.4-.36-.67-.36h-2.27s2.07-.1,2.07-.1c.53-.03.89-.36.91-.86,0-.24-.07-.46-.23-.63-.29-.3-.73-.33-1.09-.33-.26,0-.56.03-.86.05-.25.02-.49.04-.7.05h-3.74s-1.34.15-1.34.15l6.93-.74c.24-.03.46-.04.69-.04,1.28,0,2.38.42,3.48,1.33,1.08.9,2.12,1.35,3.08,1.35l8.31-.13,11.12-.24,13.46-.31s3.05-.08,3.05-.08c.53,0,.9.14,1.21.45.33.32.43.71.38,1.38-.04.44-.49,1.17-.93,1.17l-4.29.04-1.25-.12-3.98-.02-.79-.1-3.5-.04-4.69-.11-6.49-.07-1.25-.12-4.18-.05-4.48-.12c-.24-.03-.53-.05-.8-.05-1.56,0-2.93.52-4.2,1.58-.54.46-1.64,1.22-2.88,1.22Z"/>
        <path fill="#ea4b00" d="M14.85,1.02c.96.09,1.8.47,2.67,1.19,1.18.97,2.32,1.47,3.4,1.47h.05s0,0,0,0l8.27-.13,11.12-.24,8.78-.2,4.68-.1,3.04-.08h.05c.34,0,.58.09.8.31.14.14.28.33.23.98-.02.26-.3.67-.43.71l-4.24.04-1.25-.11h-.04s-.04,0-.04,0l-3.88-.02-.79-.1h-.06s-.06,0-.06,0l-3.43-.03-4.71-.11-6.44-.07-1.25-.12h-.04s-.04,0-.04,0l-4.12-.04-4.45-.12c-.29-.03-.58-.05-.86-.05-1.68,0-3.16.55-4.52,1.7-.82.69-1.73,1.09-2.51,1.11.21-.2.35-.46.4-.76.06-.4-.06-.82-.32-1.14,0,0,0,0,0,0,.16-.15.29-.34.38-.57.18-.45.12-1.06-.16-1.47-.05-.08-.11-.15-.18-.21.17-.22.28-.5.29-.81.01-.37-.11-.72-.36-.99h0ZM14.36,0C14.12,0,13.87.01,13.62.04L.01,1.49c-.04.19.05.33.12.36.01,0,.02,0,.04,0,.06,0,.15-.04.24-.04l6.39-.05,1.29-.13h3.74c.46-.02,1.07-.11,1.56-.11s.83.09.82.45c0,.2-.13.36-.43.38L.06,3.01c-.07,0-.07.26,0,.31.07.05.13.11.31.11l13.63.02c.34,0,.39.49.31.67-.1.24-.3.37-.63.38l-11.27.05-2.3.03c-.12,0-.15.25-.09.31.04.04.16.08.26.08.02,0,.05,0,.07,0,.14-.03.28-.04.41-.04.39,0,.75.09,1.13.1l2.64.07,5.29.31c.42.02.78.07,1.19.08l2.83.1c.25,0,.38.29.35.48-.03.17-.18.28-.4.28,0,0,0,0-.01,0l-4.54-.09-3.97-.08L.04,6.03c-.02.15-.02.26,0,.39l3.37.38,3.39.36,4.2.46,3.4.35c.11.01.22.02.33.02,1.16,0,2.32-.6,3.21-1.34,1.16-.98,2.43-1.46,3.87-1.46.26,0,.52.02.79.05l4.49.12,4.14.04,1.29.13,6.48.07,4.7.11,3.44.03.85.1,3.94.02,1.3.12,4.29-.04c.77,0,1.37-.99,1.42-1.63.06-.76-.06-1.32-.52-1.78-.4-.39-.88-.59-1.5-.59-.03,0-.05,0-.08,0l-3.04.08-4.68.1-8.78.2-11.12.24-8.27.13s-.03,0-.04,0c-1.02,0-2.01-.62-2.76-1.24C17.02.5,15.82,0,14.36,0h0Z"/>
      </g>
      <!-- Knife (back) paths — spans y ≈ 15.8–21.86 in viewBox -->
      <g id="g-knife">
        <path fill="#ea4b00" d="M47.58,20.94l-12.99-.19-17.19.15-14.8.27c-.73,0-1.18-.82-1.21-1.39-.03-.45.16-.98.45-1.29.18-.19.38-.29.6-.29l5.27-.02,1.48.12,5.34.04,6.33.11,8,.12,6.33.04c1.83,0,2.71-1.35,3.18-2.08.05-.08.11-.17.16-.24l3.73.06,2.7.1,2.6.08,1.04.1,2.46.23,2.78.43c2.58.4,5.93,1.54,7.34,2.95.12.12.07.52-.05.77-.04.08-.16.32-.72.32l-12.8-.41Z"/>
        <path fill="#ea4b00" d="M38.77,16.8l3.43.06,2.72.1,2.56.08,1.04.11,2.42.22,2.78.43c2.4.37,5.62,1.45,6.99,2.74,0,.08-.03.19-.06.27,0,0-.07.04-.32.04,0,0,0,0,0,0l-12.75-.41-13.01-.19-17.19.15-14.8.27c-.37,0-.67-.55-.7-.92-.02-.31.11-.71.31-.92.12-.13.21-.13.24-.13l5.22-.02,1.48.12h.04s.04,0,.04,0l5.3.04,6.34.11,8,.12,6.35.04c2.08,0,3.09-1.55,3.58-2.3h0ZM38.33,15.8c-.35,0-.99,2.31-3.15,2.31,0,0-.01,0-.02,0l-6.32-.04-7.99-.12-6.33-.11-5.31-.04-1.52-.13-5.27.02c-1.02,0-1.6,1.2-1.55,2.11.05.82.68,1.86,1.7,1.86,0,0,.02,0,.03,0l14.79-.27,17.18-.15,12.99.19,12.73.41s.05,0,.08,0c.53,0,.96-.17,1.17-.6.16-.33.3-.99-.05-1.34-1.58-1.58-5.22-2.72-7.62-3.09l-2.81-.44-2.45-.23-1.07-.11-2.6-.08-2.71-.1-3.91-.06h0Z"/>
      </g>
    </svg>
  </div>

  <script>
    var forkEl  = document.getElementById('fork');
    var knifeEl = document.getElementById('knife');
    var rightEl = document.getElementById('right');
    var gForkEl  = document.getElementById('g-fork');
    var gKnifeEl = document.getElementById('g-knife');

    // ---- Nav state ----
    function setEnabled(el, enabled) {
      el.classList.toggle('disabled', !enabled);
      el.setAttribute('aria-disabled', enabled ? 'false' : 'true');
      el.setAttribute('tabindex', enabled ? '0' : '-1');
      // Groups always stay at full opacity; disabled halves are silently ignored
      // by the tap guard in pointerup, not visually dimmed.
    }

    function onKey(el, fn) {
      el.addEventListener('keydown', function (e) {
        if ((e.key === 'Enter' || e.key === ' ') && !el.classList.contains('disabled')) {
          e.preventDefault();
          fn();
        }
      });
    }

    if (window.kioskForkKnife) {
      window.kioskForkKnife.onNavState(function (state) {
        setEnabled(forkEl,  !!state.canGoForward);
        setEnabled(knifeEl, !!state.canGoBack);
      });

      onKey(forkEl,  function () { window.kioskForkKnife.goForward(); });
      onKey(knifeEl, function () { window.kioskForkKnife.goBack(); });
    }

    // ---- Hit test: only the graphic area is draggable/tappable ----
    // Transparent shadow padding (--shadow-pad on each side) is click-through.
    function hitInGraphic(e) {
      var w   = document.documentElement.clientWidth;
      var h   = document.documentElement.clientHeight;
      var pad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--shadow-pad')) || 0;
      return e.clientX >= pad && e.clientX <= w - pad &&
             e.clientY >= pad && e.clientY <= h - pad;
    }

    // ---- Whole-control drag with tap threshold ----
    // pointerdown anywhere in the graphic area starts tracking. Moving more than
    // DRAG_THRESHOLD px switches to drag mode; releasing within the threshold is a tap.
    // Pointer capture keeps pointermove/pointerup firing even when the cursor
    // leaves the window, making drags smooth on Linux Cinnamon.
    var DRAG_THRESHOLD = 5;
    var isDragging  = false; // drag in progress (dragStart has been sent)
    var capturedId  = null;
    var dragStartX  = 0;
    var dragStartY  = 0;
    var pressedHalf = null; // 'fork' | 'knife' at the time of pointerdown

    rightEl.addEventListener('pointerdown', function (e) {
      if (!hitInGraphic(e)) return;
      e.preventDefault();
      rightEl.setPointerCapture(e.pointerId);
      capturedId  = e.pointerId;
      isDragging  = false;
      dragStartX  = e.clientX;
      dragStartY  = e.clientY;
      pressedHalf = (e.target === forkEl  || forkEl.contains(e.target))  ? 'fork'
                  : (e.target === knifeEl || knifeEl.contains(e.target)) ? 'knife'
                  : null;
    });

    rightEl.addEventListener('pointermove', function (e) {
      if (capturedId === null) return;
      var dx = e.clientX - dragStartX;
      var dy = e.clientY - dragStartY;
      if (!isDragging && Math.sqrt(dx * dx + dy * dy) > DRAG_THRESHOLD) {
        isDragging = true;
        rightEl.classList.add('grabbing');
        if (window.kioskForkKnife) {
          // dragStart records the cursor-to-window offset in the main process.
          // dragMove immediately after positions the window at the current cursor.
          window.kioskForkKnife.dragStart();
          window.kioskForkKnife.dragMove();
        }
      } else if (isDragging) {
        if (window.kioskForkKnife) window.kioskForkKnife.dragMove();
      }
    });

    rightEl.addEventListener('pointerup', function (e) {
      if (capturedId === null) return;
      try { rightEl.releasePointerCapture(capturedId); } catch (_) {}
      capturedId = null;
      rightEl.classList.remove('grabbing');

      if (isDragging) {
        isDragging = false;
        if (window.kioskForkKnife) window.kioskForkKnife.dragEnd();
        return; // drag ended — do not navigate
      }

      // Tap: navigate based on which half received the pointerdown.
      // Disabled halves absorb the tap visually but do not navigate.
      if (pressedHalf === 'fork' && !forkEl.classList.contains('disabled')) {
        if (window.kioskForkKnife) window.kioskForkKnife.goForward();
      } else if (pressedHalf === 'knife' && !knifeEl.classList.contains('disabled')) {
        if (window.kioskForkKnife) window.kioskForkKnife.goBack();
      }
      pressedHalf = null;
    });

    rightEl.addEventListener('pointercancel', function () {
      rightEl.classList.remove('grabbing');
      if (isDragging && window.kioskForkKnife) window.kioskForkKnife.dragEnd();
      isDragging  = false;
      capturedId  = null;
      pressedHalf = null;
    });
  </script>
</body>
</html>
