<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self' file:;">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      /* Width and height track the BrowserWindow size set by the main process.
         height:100% instead of 44px avoids fractional-scaling mismatches.    */
      width: 100%; height: 100%;
      background: #ffffff;
      overflow: hidden;
    }
    body {
      width: 100%; height: 100%;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    /* Orange border overlay — always traces the live viewport edges regardless
       of window width.  pointer-events:none so it never blocks clicks, drag,
       or input focus.  z-index above #bar so it isn't painted over.
       Matches kiosk-carbon.html / kiosk-clock.html --shadow-color aesthetics
       but uses the brand orange (same as before). */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      border: 1px solid #ea4b00;
      pointer-events: none;
      z-index: 10;
    }

    @font-face {
      font-family: 'Apercu Mono';
      src: url('assets/fonts/ApercuMono.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    /* Window is 311 × 44 px at rest (SVG viewBox 310.59 × 43.62).
       Text in SVG starts at translate(28.98, 25.88) — drag pad is the
       leftmost 29 px; input fills the remainder.  padding-right gives
       breathing room on the right when expanded.                        */
    #bar {
      display: flex;
      align-items: stretch;
      width: 100%;
      height: 100%;
      padding-right: 12px;
    }

    #drag-pad {
      flex-shrink: 0;
      width: 29px;
    }

    #url {
      flex: 1;
      min-width: 0;       /* allow flex child to shrink below content size */
      border: none;
      outline: none;
      background: transparent;
      font-family: 'Apercu Mono', 'Apercu-Mono', monospace;
      font-size: 14px;
      color: #ea4b00;
      padding: 0;
      margin: 0;
      /* Resting state: truncate long URLs with an ellipsis.
         When focused, Chromium ignores this and scrolls normally. */
      text-overflow: ellipsis;
    }

  </style>
</head>
<body>
  <!-- drag-pad: grab to move freely; dblclick to re-dock to hub. -->
  <div id="bar">
    <div id="drag-pad"></div>
    <input id="url" type="text"
           spellcheck="false" autocomplete="off"
           autocorrect="off" autocapitalize="off">
  </div>

  <script>
    var liveUrl  = '';
    var urlInput = document.getElementById('url');
    var bar      = document.getElementById('bar');

    // ---- Off-screen sizer for accurate text-width measurement ----
    // Same font string as #url so the measurement matches the rendered text.
    var sizer = document.createElement('span');
    sizer.style.cssText =
      'position:absolute;left:-9999px;top:-9999px;' +
      'white-space:nowrap;visibility:hidden;' +
      'font:14px "Apercu Mono","Apercu-Mono",monospace;';
    document.body.appendChild(sizer);

    function measureTextW(text) {
      sizer.textContent = text;
      return sizer.offsetWidth;
    }

    // ---- Expand / shrink ----
    var isHovered   = false;
    var isFocused   = false;
    var shrinkTimer = null;

    // 29 px drag pad + text + 12 px bar padding-right + 8 px buffer.
    function measureAndResize() {
      if (!window.kioskAddressBar) return;
      var needed = Math.ceil(29 + measureTextW(urlInput.value || liveUrl) + 12 + 8);
      window.kioskAddressBar.resize(needed);
    }

    function maybeShrink() {
      clearTimeout(shrinkTimer);
      if (!isHovered && !isFocused) {
        shrinkTimer = setTimeout(function () {
          if (window.kioskAddressBar) window.kioskAddressBar.shrink();
        }, 300);
      }
    }

    // ---- URL updates from main process ----
    if (window.kioskAddressBar) {
      window.kioskAddressBar.onUrl(function (url) {
        liveUrl = url;
        if (document.activeElement !== urlInput) {
          urlInput.value = url;
          // Re-measure while hovered so the bar stays fitted to the new URL.
          if (isHovered) measureAndResize();
        }
      });
    }

    // ---- Hover ----
    bar.addEventListener('pointerenter', function () {
      isHovered = true;
      clearTimeout(shrinkTimer);
      measureAndResize();
    });

    bar.addEventListener('pointerleave', function () {
      isHovered = false;
      maybeShrink();
    });

    // ---- Input events ----
    urlInput.addEventListener('focus', function () {
      isFocused = true;
      clearTimeout(shrinkTimer);
      urlInput.select();
      measureAndResize();
      if (window.kioskAddressBar) window.kioskAddressBar.focus();
    });

    urlInput.addEventListener('blur', function () {
      isFocused = false;
      urlInput.value = liveUrl;
      maybeShrink();
    });

    var keydownThrottle = null;
    urlInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        var val = urlInput.value.trim();
        if (val && window.kioskAddressBar) window.kioskAddressBar.navigate(val);
        urlInput.blur();
      } else if (e.key === 'Escape') {
        e.preventDefault();
        urlInput.value = liveUrl;
        urlInput.blur();
        if (window.kioskAddressBar) window.kioskAddressBar.escape();
      } else {
        if (!keydownThrottle && window.kioskAddressBar) {
          window.kioskAddressBar.keydown();
          keydownThrottle = setTimeout(function () { keydownThrottle = null; }, 500);
        }
      }
    });

    // ---- Drag from bar (anywhere except the input) ----
    var DRAG_THRESHOLD = 5;
    var isDragging  = false;
    var capturedId  = null;
    var dragStartX  = 0;
    var dragStartY  = 0;

    bar.addEventListener('pointerdown', function (e) {
      if (e.target === urlInput) return;
      e.preventDefault();
      bar.setPointerCapture(e.pointerId);
      capturedId = e.pointerId;
      isDragging = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    bar.addEventListener('pointermove', function (e) {
      if (capturedId === null) return;
      var dx = e.clientX - dragStartX;
      var dy = e.clientY - dragStartY;
      if (!isDragging && Math.sqrt(dx * dx + dy * dy) > DRAG_THRESHOLD) {
        isDragging = true;
        bar.classList.add('dragging');
        if (window.kioskAddressBar) {
          window.kioskAddressBar.dragStart();
          window.kioskAddressBar.dragMove();
        }
      } else if (isDragging) {
        if (window.kioskAddressBar) window.kioskAddressBar.dragMove();
      }
    });

    bar.addEventListener('pointerup', function (e) {
      if (capturedId === null) return;
      try { bar.releasePointerCapture(capturedId); } catch (_) {}
      capturedId = null;
      bar.classList.remove('dragging');
      if (isDragging) {
        isDragging = false;
        if (window.kioskAddressBar) window.kioskAddressBar.dragEnd();
      }
    });

    bar.addEventListener('pointercancel', function () {
      bar.classList.remove('dragging');
      if (isDragging && window.kioskAddressBar) window.kioskAddressBar.dragEnd();
      isDragging = false;
      capturedId = null;
    });

    // Double-click on bar (not input) re-docks to hub.
    bar.addEventListener('dblclick', function (e) {
      if (e.target === urlInput) return;
      if (window.kioskAddressBar) window.kioskAddressBar.dock();
    });
  </script>
</body>
</html>
