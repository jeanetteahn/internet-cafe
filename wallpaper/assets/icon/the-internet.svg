<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Main sphere gradient: light source upper-left, deepens toward lower-right -->
    <radialGradient id="body" gradientUnits="userSpaceOnUse"
                    cx="97" cy="75" r="168"
                    fx="90" fy="68">
      <stop offset="0%"   stop-color="#ff8040"/>
      <stop offset="22%"  stop-color="#ea4b00"/>
      <stop offset="68%"  stop-color="#7d2800"/>
      <stop offset="100%" stop-color="#3e1100"/>
    </radialGradient>

    <!-- Specular highlight: white blob, upper-left of sphere -->
    <radialGradient id="spec" gradientUnits="userSpaceOnUse"
                    cx="100" cy="82" r="54">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="42%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip highlight to sphere boundary -->
    <clipPath id="sc">
      <circle cx="128" cy="120" r="108"/>
    </clipPath>

    <!-- Drop shadow blur -->
    <filter id="dsf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <!-- Drop shadow -->
  <ellipse cx="131" cy="242" rx="74" ry="9"
           fill="#000" fill-opacity="0.20" filter="url(#dsf)"/>

  <!-- Sphere body -->
  <circle cx="128" cy="120" r="108" fill="url(#body)"/>

  <!-- Specular highlight (clipped to sphere) -->
  <g clip-path="url(#sc)">
    <ellipse cx="100" cy="82" rx="46" ry="30"
             transform="rotate(-22 100 82)"
             fill="url(#spec)"/>
  </g>

  <!-- Subtle dark rim -->
  <circle cx="128" cy="120" r="108" fill="none"
          stroke="#2e0e00" stroke-width="3" stroke-opacity="0.45"/>
</svg>
