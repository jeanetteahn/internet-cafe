<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; font-src file:; script-src 'unsafe-inline';">
  <style>
    @font-face {
      font-family: 'Apercu';
      src: url('assets/fonts/Apercu.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 28px;
      overflow: hidden;
      background: #1a1a1a;
      color: #c0c0c0;
      font-family: 'Apercu', ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* The full strip is draggable; the button overrides that below. */
    .handle {
      display: flex;
      align-items: center;
      height: 28px;
      padding: 0 8px 0 6px;
      gap: 6px;
      -webkit-app-region: drag;
      cursor: grab;
    }

    /* 2 × 3 grid of dotted dots — purely visual grip indicator */
    .grip {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(2, 5px);
      grid-template-rows: repeat(3, 5px);
      gap: 2px;
      opacity: 0.55;
      -webkit-app-region: drag;
    }

    .grip-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      border: 1px dotted #aaa;
    }

    .title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #999;
      font-size: 11px;
      letter-spacing: 0.01em;
      -webkit-app-region: drag;
    }

    .reset-btn {
      flex-shrink: 0;
      padding: 2px 8px;
      background: transparent;
      border: 1px solid #444;
      border-radius: 3px;
      color: #888;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.4;
      cursor: pointer;
      /* must not inherit the drag region from .handle */
      -webkit-app-region: no-drag;
      transition: border-color 0.12s, color 0.12s;
    }

    .reset-btn:hover {
      border-color: #777;
      color: #ccc;
    }

    .reset-btn:focus-visible {
      outline: 2px solid #5a8fd8;
      outline-offset: 2px;
    }

    .reset-btn:active {
      background: #2a2a2a;
    }
  </style>
</head>
<body>
  <div class="handle">
    <div class="grip" aria-hidden="true">
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
    </div>
    <span class="title" id="title">Loading…</span>
    <button class="reset-btn" id="resetBtn" title="Restore panel to its default position and size">
      Reset
    </button>
  </div>

  <script>
    if (window.kioskHandle) {
      window.kioskHandle.onTitle(function (title) {
        document.getElementById('title').textContent = title || '';
      });
      document.getElementById('resetBtn').addEventListener('click', function () {
        window.kioskHandle.resetPosition();
      });
    }
  </script>
</body>
</html>
