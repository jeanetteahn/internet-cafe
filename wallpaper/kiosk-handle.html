<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; font-src file:; script-src 'unsafe-inline';">
  <style>
    @font-face {
      font-family: 'Apercu';
      src: url('assets/fonts/Apercu.otf') format('opentype');
      font-weight: normal;
      font-style: normal;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      color: #c0c0c0;
      font-family: 'Apercu', ui-sans-serif, system-ui, -apple-system, sans-serif;
      font-size: 12px;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Drag strip — positioned absolutely inside the top margin */
    #strip {
      position: absolute;
      /* Not fully transparent on purpose: Windows passes the mouse through
         alpha-0 pixels of a transparent window, so the pointer showed the
         desktop arrow over an idle strip and the strip couldn't be grabbed.
         1 % black is invisible but still counts as part of the window. */
      background: rgba(0, 0, 0, 0.01);
      display: flex;
      align-items: center;
      padding: 0 8px 0 6px;
      gap: 6px;
    }

    #strip.active {
      background: #1d2535;
      box-shadow: inset 3px 0 0 #4a90d9;
    }

    .grip {
      flex-shrink: 0;
      display: grid;
      grid-template-columns: repeat(2, 5px);
      grid-template-rows: repeat(3, 5px);
      gap: 2px;
      opacity: 0.55;
    }

    .grip-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      border: 1px dotted #aaa;
    }

    .title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #999;
      font-size: 11px;
      letter-spacing: 0.01em;
    }

    .btn {
      flex-shrink: 0;
      padding: 2px 6px;
      background: transparent;
      border: 1px solid #444;
      border-radius: 3px;
      color: #888;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.4;
      cursor: pointer;
      transition: border-color 0.12s, color 0.12s, opacity 0.12s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn svg { display: block; }

    .btn:hover { border-color: #777; }
    .btn:hover svg { opacity: 0.9; }

    .btn:focus-visible {
      outline: 2px solid #5a8fd8;
      outline-offset: 2px;
    }

    .btn:active { background: #2a2a2a; }

    .btn:disabled {
      opacity: 0.3;
      pointer-events: none;
    }

    /* Orange 1 px border around the browser area */
    #border {
      position: absolute;
      border: 1px solid #e74e25;
      pointer-events: none;
      box-sizing: border-box;
    }

    /* Hinge overlay — fills the window, hinges positioned inside */
    #hinges {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div id="strip">
    <div class="grip" aria-hidden="true">
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
      <div class="grip-dot"></div>
    </div>
    <span class="title" id="title">Loading...</span>
    <button class="btn" id="resetBtn" title="Restore panel to its default position and size">Reset</button>
  </div>
  <div id="border"></div>
  <div id="hinges"></div>

  <script>
    // Bracket paint (per Cyrus): orange brackets filled white, with the orange
    // border line running through the middle underneath (#border is drawn
    // before #hinges, so the white fill hides the line where it crosses).
    var HINGE_ORANGE = '#e74e25';
    var HINGE_FILL   = '#ffffff'; // interiors and screw holes

    // Builds one piece: the white interior polygon (if any), a white copy of
    // the outer outline so the screw holes read white, then the orange shape.
    function hingeSvg(viewBox, interiorPoints, d) {
      var outline = d.slice(0, d.indexOf('Z') + 1); // first subpath = outer edge, no holes
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + viewBox + '">' +
        (interiorPoints ? '<polygon fill="' + HINGE_FILL + '" points="' + interiorPoints + '"/>' : '') +
        '<path fill="' + HINGE_FILL + '" d="' + outline + '"/>' +
        '<path fill="' + HINGE_ORANGE + '" d="' + d + '"/>' +
        '</svg>';
    }

    var SVGS = {
      'corner-hinge': hingeSvg('0 0 34.35 34.35',
        '10.79 11.16 31.12 11.16 31.12 3.25 3.42 3.25 3.42 3.42 2.88 3.42 2.88 31.12 10.79 31.12 10.79 11.16',
        'M28.41,1.16V0s-14.21,0-14.21,0H0s0,14.21,0,14.21v14.21s1.16,0,1.16,0c0,3.28,2.66,5.94,5.94,5.94,3.28,0,5.94-2.66,5.94-5.94h1.16s14.21-14.21,14.21-14.21v-1.16c3.28,0,5.94-2.66,5.94-5.94s-2.66-5.94-5.94-5.94ZM7.1,30.39c-1.09,0-1.98-.89-1.98-1.98s.89-1.98,1.98-1.98,1.98.89,1.98,1.98-.89,1.98-1.98,1.98ZM28.41,9.08c-1.09,0-1.98-.89-1.98-1.98s.89-1.98,1.98-1.98,1.98.89,1.98,1.98-.89,1.98-1.98,1.98Z'),
      'strap-hinge': hingeSvg('0 0 89.98 13.94', null,
        'M84.1.94v-.94H5.88v1.14C2.63,1.14,0,3.73,0,6.91s2.63,5.77,5.88,5.77v1.25h78.22v-1.46c3.25,0,5.88-2.58,5.88-5.77s-2.63-5.77-5.88-5.77ZM5.88,8.91c-1.09,0-1.98-.87-1.98-1.94s.89-1.94,1.98-1.94,1.98.87,1.98,1.94-.89,1.94-1.98,1.94ZM21.53,8.91c-1.09,0-1.98-.87-1.98-1.94s.89-1.94,1.98-1.94,1.98.87,1.98,1.94-.89,1.94-1.98,1.94ZM37.17,8.91c-1.09,0-1.98-.87-1.98-1.94s.89-1.94,1.98-1.94,1.98.87,1.98,1.94-.89,1.94-1.98,1.94ZM52.81,8.91c-1.09,0-1.98-.87-1.98-1.94s.89-1.94,1.98-1.94,1.98.87,1.98,1.94-.89,1.94-1.98,1.94ZM68.46,8.91c-1.09,0-1.98-.87-1.98-1.94s.89-1.94,1.98-1.94,1.98.87,1.98,1.94-.89,1.94-1.98,1.94ZM84.1,8.71c-1.09,0-1.98-.87-1.98-1.94s.89-1.94,1.98-1.94,1.98.87,1.98,1.94-.89,1.94-1.98,1.94Z'),
      'edge-hinge': hingeSvg('0 0 34.35 54.5',
        '22.96 31.28 22.96 51.61 30.86 51.61 30.86 23.91 30.69 23.91 30.69 23.37 2.99 23.37 2.99 31.28 22.96 31.28',
        'M21.31,5.94h-1.16v14.21H5.94v1.16c-3.28,0-5.94,2.66-5.94,5.94s2.66,5.94,5.94,5.94v1.16h14.21v14.21h1.16c0,3.28,2.66,5.94,5.94,5.94s5.94-2.66,5.94-5.94h1.16v-14.21h0V5.94h-1.16c0-3.28-2.66-5.94-5.94-5.94s-5.94,2.66-5.94,5.94ZM29.23,48.56c0,1.09-.89,1.98-1.98,1.98s-1.98-.89-1.98-1.98.89-1.98,1.98-1.98,1.98.89,1.98,1.98ZM7.92,27.25c0,1.09-.89,1.98-1.98,1.98s-1.98-.89-1.98-1.98.89-1.98,1.98-1.98,1.98.89,1.98,1.98ZM29.23,5.94c0,1.09-.89,1.98-1.98,1.98s-1.98-.89-1.98-1.98.89-1.98,1.98-1.98,1.98.89,1.98,1.98Z'),
    };

    // Natural pixel dimensions for each piece
    var DIMS = {
      'corner-hinge': { w: 34, h: 34 },
      'strap-hinge':  { w: 90, h: 14 },
      'edge-hinge':   { w: 34, h: 55 },
    };

    // Per-panel hinge layout.
    // edge: 'corner-tl' | 'corner-tr' | 'corner-bl' | 'corner-br'
    //       | 'top' | 'bottom' | 'left' | 'right'
    // pct:  0–1 position along the edge (ignored for corner edges)
    // corner-t pieces also take dir: 'up'|'down'|'left'|'right' (which way the stem points)
    var PANEL_HINGES = {
      topLeft: [
        { piece: 'strap-hinge', edge: 'top',    pct: 0.70 },
        { piece: 'edge-hinge',  edge: 'right',  pct: 0.30 },
        { piece: 'strap-hinge', edge: 'bottom', pct: 0.20 },
        { piece: 'strap-hinge', edge: 'left',   pct: 0.60 },
      ],
      hub: [
        { piece: 'strap-hinge', edge: 'top',    pct: 0.35 },
        { piece: 'strap-hinge', edge: 'right',  pct: 0.65 },
        { piece: 'edge-hinge',  edge: 'bottom', pct: 0.75 },
        { piece: 'strap-hinge', edge: 'left',   pct: 0.45 },
      ],
      topRight: [
        { piece: 'strap-hinge', edge: 'top',    pct: 0.25 },
        { piece: 'strap-hinge', edge: 'right',  pct: 0.55 },
        { piece: 'strap-hinge', edge: 'bottom', pct: 0.80 },
        { piece: 'edge-hinge',  edge: 'left',   pct: 0.70 },
      ],
      bottomLeft: [
        { piece: 'edge-hinge',  edge: 'top',    pct: 0.30 },
        { piece: 'strap-hinge', edge: 'right',  pct: 0.40 },
        { piece: 'strap-hinge', edge: 'bottom', pct: 0.65 },
        { piece: 'strap-hinge', edge: 'left',   pct: 0.75 },
      ],
      bottomRight: [
        { piece: 'strap-hinge', edge: 'top',    pct: 0.80 },
        { piece: 'edge-hinge',  edge: 'right',  pct: 0.35 },
        { piece: 'strap-hinge', edge: 'bottom', pct: 0.30 },
        { piece: 'strap-hinge', edge: 'left',   pct: 0.60 },
      ],
    };

    var HANDLE_H      = 28;
    var currentMargin = 18;
    var currentKey    = null;

    // How far (px) each edge piece reaches in past the orange border, over
    // the page.  This page sits underneath the panel's BrowserView, so the
    // overlapping part is invisible here — the same placements are reported
    // to the main process, which forwards them to kiosk-preload.js to draw
    // that part inside the page itself.
    // 7 = half the strap's 14 px thickness, so the border runs through the
    // middle of each piece.
    var HINGE_OVERLAP = 7;
    var lastReported  = '';

    // Sets position, size, and optional CSS transform on an element
    function place(el, dims, left, top, transform) {
      el.style.position  = 'absolute';
      el.style.width     = dims.w + 'px';
      el.style.height    = dims.h + 'px';
      el.style.left      = left + 'px';
      el.style.top       = top + 'px';
      if (transform) el.style.transform = transform;
    }

    // Structured copy of a hinge's SVG (viewBox + visible shapes) so the
    // panel page can rebuild it with createElementNS — no innerHTML, which
    // Trusted Types pages would reject.
    function describeSvg(el) {
      var svg = el.firstElementChild;
      var shapes = [];
      Array.prototype.forEach.call(svg.children, function (c) {
        if (c.getAttribute('fill') === 'transparent') return;
        var attrs = {};
        Array.prototype.forEach.call(c.attributes, function (a) { attrs[a.name] = a.value; });
        shapes.push({ tag: c.tagName, attrs: attrs });
      });
      return { viewBox: svg.getAttribute('viewBox'), shapes: shapes };
    }

    function renderHinges(M, H, W, Wh, panelW, panelH) {
      var container = document.getElementById('hinges');
      var hinges = PANEL_HINGES[currentKey] || [];

      // Build the pieces once per panel; resizes (60 fps during the
      // enlarge/shrink tween) only reposition them.
      if (container.dataset.key !== String(currentKey)) {
        container.innerHTML = '';
        container.dataset.key = String(currentKey);
        hinges.forEach(function (h) {
          var el = document.createElement('div');
          el.innerHTML = (h.piece === 'corner-t') ? SVGS['edge-hinge'] : SVGS[h.piece];
          container.appendChild(el);
        });
      }

      var O = HINGE_OVERLAP;
      var report = [];

      hinges.forEach(function (h, i) {
        var dims = (h.piece === 'corner-t') ? DIMS['edge-hinge'] : DIMS[h.piece];
        var el   = container.children[i];
        el.style.transform = '';
        var pct = (h.pct !== undefined) ? h.pct : 0.5;

        switch (h.edge) {
          case 'corner-tl':
            if (h.piece === 'corner-t') {
              // T-junction at (M,M). dir 'down': stem vertical, arm extends left.
              if (h.dir === 'down') place(el, dims, M - 20, M - 27);
            } else {
              place(el, dims, M - dims.w, M - dims.h, 'scale(-1,-1)');
            }
            break;

          case 'corner-tr':
            if (h.piece === 'corner-t') {
              // T-junction at (W-M,M). dir 'up': scaleX(-1) flips arm rightward, stem vertical.
              if (h.dir === 'up') place(el, dims, W - M - 14, M - 27, 'scaleX(-1)');
            } else {
              place(el, dims, W - M, M - dims.h, 'scaleY(-1)');
            }
            break;

          case 'corner-bl':
            if (h.piece === 'corner-t') {
              // T-junction at (M,Wh-M).
              // dir 'left': rotate(90deg) scaleY(-1) → stem horizontal going left, arm down.
              // dir 'down': natural orientation, arm extends left.
              if (h.dir === 'left') place(el, dims, M - 17.5, Wh - M - 24.5, 'rotate(90deg) scaleY(-1)');
              if (h.dir === 'down') place(el, dims, M - 20,   Wh - M - 27);
            } else {
              place(el, dims, M - dims.w, Wh - M, 'scaleX(-1)');
            }
            break;

          case 'corner-br':
            if (h.piece === 'corner-t') {
              // T-junction at (W-M,Wh-M). dir 'down': scaleX(-1) flips arm rightward, stem vertical.
              if (h.dir === 'down') place(el, dims, W - M - 14, Wh - M - 27, 'scaleX(-1)');
            } else {
              place(el, dims, W - M, Wh - M);
            }
            break;

          case 'top': {
            // pct from frame left corner
            var cx = M + pct * panelW;
            if (h.piece === 'strap-hinge') {
              // Bottom edge of strap sits O px below the border (y=M)
              place(el, dims, cx - dims.w / 2, M - dims.h + O);
            } else {
              // edge-hinge rotate(90deg): crossbar at bottom overlapping the border, stem up
              place(el, dims, cx - 17, M - 44.5 + O, 'rotate(90deg)');
            }
            break;
          }

          case 'bottom': {
            // pct from frame left corner
            var cx2 = M + pct * panelW;
            if (h.piece === 'strap-hinge') {
              // Top edge of strap sits O px above the border (y=Wh-M)
              place(el, dims, cx2 - dims.w / 2, Wh - M - O);
            } else {
              // edge-hinge rotate(-90deg): crossbar at top overlapping the border, stem down
              place(el, dims, cx2 - 17, Wh - M - 10.5 - O, 'rotate(-90deg)');
            }
            break;
          }

          case 'left': {
            // pct from frame top corner; piece extends leftward from border (x=M)
            var cy = M + pct * panelH;
            if (h.piece === 'strap-hinge') {
              // Rotated 90deg: visual right edge at x=M → left = M - w/2 - h/2
              place(el, dims, M - dims.w / 2 - dims.h / 2 + O, cy - dims.h / 2, 'rotate(90deg)');
            } else {
              // edge-hinge natural: crossbar overlapping the border, stem points left
              place(el, dims, M - 34 + O, cy - 27.5);
            }
            break;
          }

          case 'right': {
            // pct from frame top corner; piece extends rightward from border (x=W-M)
            var cy2 = M + pct * panelH;
            if (h.piece === 'strap-hinge') {
              // Rotated 90deg: visual left edge at x=W-M → left = W-M - w/2 + h/2
              place(el, dims, W - M - dims.w / 2 + dims.h / 2 - O, cy2 - dims.h / 2, 'rotate(90deg)');
            } else {
              // edge-hinge scaleX(-1): crossbar overlapping the border, stem points right
              place(el, dims, W - M - O, cy2 - 27.5, 'scaleX(-1)');
            }
            break;
          }
        }

        var svgDesc = describeSvg(el);
        report.push({
          left: parseFloat(el.style.left), top: parseFloat(el.style.top),
          w: dims.w, h: dims.h, transform: el.style.transform || '',
          viewBox: svgDesc.viewBox, shapes: svgDesc.shapes,
        });
      });

      // Only send when something moved — resize events fire every frame.
      var json = JSON.stringify(report);
      if (json !== lastReported && window.kioskHandle && window.kioskHandle.reportHinges) {
        lastReported = json;
        window.kioskHandle.reportHinges(report);
      }
    }

    function render() {
      var M      = currentMargin;
      var H      = HANDLE_H;
      var W      = window.innerWidth;
      var Wh     = window.innerHeight;
      var panelW = W  - 2 * M;
      var panelH = Wh - 2 * M - H;

      var strip = document.getElementById('strip');
      strip.style.left   = M + 'px';
      strip.style.top    = M + 'px';
      strip.style.width  = panelW + 'px';
      strip.style.height = H + 'px';

      var border = document.getElementById('border');
      border.style.left   = M + 'px';
      border.style.top    = M + 'px';
      border.style.width  = panelW + 'px';
      border.style.height = (Wh - 2 * M) + 'px';

      renderHinges(M, H, W, Wh, panelW, Wh - 2 * M);
    }

    window.addEventListener('resize', render);

    if (window.kioskHandle) {
      window.kioskHandle.onTitle(function (title) {
        document.getElementById('title').textContent = title || '';
      });
      window.kioskHandle.onMode(function (mode) {
        document.getElementById('strip').classList.toggle('active', mode === 'active');
      });
      window.kioskHandle.onHardware(function (cfg) {
        currentKey    = cfg.key;
        currentMargin = cfg.margin;
        render();
      });
      document.getElementById('resetBtn').addEventListener('click', function () {
        window.kioskHandle.resetPosition();
      });
    }

    // ---- Handle strip drag ----
    // Pointer-event dragging keeps the cursor inside Electron so the
    // OS/WM never takes control and shows a system cursor during the drag.
    var strip      = document.getElementById('strip');
    var isDragging = false;
    var capturedId = null;
    var dragStartX = 0;
    var dragStartY = 0;
    var DRAG_THRESHOLD = 5;

    strip.addEventListener('pointerdown', function (e) {
      if (e.button !== 0) return;
      if (e.target.closest && e.target.closest('.btn')) return;
      e.preventDefault();
      strip.setPointerCapture(e.pointerId);
      capturedId = e.pointerId;
      isDragging = false;
      dragStartX = e.clientX;
      dragStartY = e.clientY;
    });

    strip.addEventListener('pointermove', function (e) {
      if (capturedId === null) return;
      var dx = e.clientX - dragStartX;
      var dy = e.clientY - dragStartY;
      if (!isDragging && Math.sqrt(dx * dx + dy * dy) > DRAG_THRESHOLD) {
        isDragging = true;
        if (window.kioskHandle) {
          window.kioskHandle.dragStart();
          window.kioskHandle.dragMove();
        }
      } else if (isDragging) {
        if (window.kioskHandle) window.kioskHandle.dragMove();
      }
    });

    strip.addEventListener('pointerup', function (e) {
      if (capturedId === null) return;
      try { strip.releasePointerCapture(capturedId); } catch (_) {}
      capturedId = null;
      if (isDragging) {
        isDragging = false;
        if (window.kioskHandle) window.kioskHandle.dragEnd();
      }
    });

    strip.addEventListener('pointercancel', function () {
      capturedId = null;
      if (isDragging) {
        isDragging = false;
        if (window.kioskHandle) window.kioskHandle.dragEnd();
      }
    });
  </script>
</body>
</html>
